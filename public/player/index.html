<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music player - Venue Audio Stream</title>
  <link rel="stylesheet" href="/assets/design-system.css">
  <style>
    .player-container {
      max-width: 600px;
      margin: 4rem auto;
      text-align: center;
    }
    .player-card {
      padding: 3rem 2rem;
      position: relative;
      overflow: hidden;
    }
    .player-art-lg {
      width: 240px;
      height: 240px;
      border-radius: var(--qp-radius-lg);
      margin: 0 auto 2rem;
      object-fit: cover;
      box-shadow: var(--qp-shadow-lg), var(--qp-shadow-glow);
    }
    .player-controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      align-items: center;
      margin-top: 2rem;
    }
    .device-status {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: var(--qp-text-muted);
    }
  </style>
</head>
<body>
  <!-- AUTHORIZE GATE -->
  <div id="authGate" class="qp-container-sm qp-mt-xl qp-hidden">
    <div class="qp-card">
      <h1 class="qp-h3 qp-text-center qp-mb-md">🎵 Venue Player</h1>
      <form id="authForm">
        <div class="qp-mb-md">
          <label class="qp-label">Admin password</label>
          <input type="password" id="passwordInput" class="qp-input" placeholder="Enter venue admin password" required>
        </div>
        <p class="qp-text-muted qp-text-sm qp-mb-md" style="text-align:center">
          Use the admin password you chose during registration.
        </p>
        <button type="submit" class="qp-btn qp-btn-primary qp-w-full">Unlock Player</button>
      </form>
    </div>
  </div>

  <!-- START GATE (browsers require a tap before audio can play) -->
  <div id="startGate" class="qp-container-sm qp-mt-xl qp-hidden">
    <div class="qp-card qp-text-center">
      <h1 class="qp-h3 qp-mb-md">🔊 Ready to play</h1>
      <p class="qp-text-secondary qp-mb-md">Keep this tab open on the device connected to your speakers. Spotify Premium is required.</p>
      <button id="startBtn" class="qp-btn qp-btn-primary qp-w-full">Start Player</button>
      <button id="logoutBtn" class="qp-btn qp-btn-secondary qp-w-full qp-mt-md">Use a different venue password</button>
    </div>
  </div>

  <!-- MAIN PLAYER -->
  <div id="playerSection" class="qp-container qp-hidden">
    <div class="player-container">
      <div class="qp-card player-card">
        <div class="qp-np-label">Now Playing</div>

        <img id="nowPlayingArt" class="player-art-lg qp-mt-md" src="/assets/music-placeholder.svg" alt="Album Art">

        <h2 class="qp-h2 qp-mt-md" id="nowPlayingTitle">Nothing Playing</h2>
        <p class="qp-text-secondary qp-mt-xs" id="nowPlayingArtist" style="font-size:1.2rem">-</p>

        <div class="qp-progress-container qp-mt-lg" style="margin-top:2rem">
          <div class="qp-progress" id="progressBar">
            <div class="qp-progress-fill" id="progressFill"></div>
          </div>
          <div class="qp-progress-times">
            <span id="timeCurrent">0:00</span>
            <span id="timeTotal">0:00</span>
          </div>
        </div>

        <div class="player-controls">
          <button id="playBtn" class="qp-btn qp-btn-primary qp-btn-icon-lg" aria-label="Play or pause">▶️</button>
          <button id="skipBtn" class="qp-btn qp-btn-secondary qp-btn-icon-lg" aria-label="Skip">⏭️</button>
        </div>

        <div class="device-status" id="spotifyStatusText">Connecting to Spotify...</div>
      </div>
    </div>
  </div>

  <div class="qp-toast-container" id="toastContainer"></div>

  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script>
    const slug = window.location.pathname.split('/').filter(Boolean).pop();
    localStorage.removeItem(`qp_player_key_${slug}`); // legacy
    let spotifyPlayer = null;
    let deviceId = null;
    let sdkReady = false;
    let ws = null;
    let progressInterval = null;
    let trackProgressMs = 0;
    let trackDurationMs = 0;
    let isPlaying = false;
    let currentSongKey = null;   // song_id + started_at of the track we started
    let currentTrackId = null;   // Spotify track id actually loaded
    let advancing = false;       // guards against double play-next
    let pendingSong = undefined; // now_playing received before device was ready

    const $ = id => document.getElementById(id);

    function show(section) {
      ['authGate', 'startGate', 'playerSection'].forEach(id => $(id).classList.toggle('qp-hidden', id !== section));
    }

    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `qp-toast qp-toast-${type}`;
      toast.textContent = message;
      $('toastContainer').appendChild(toast);
      setTimeout(() => {
        toast.style.animation = 'qp-toast-out 0.3s ease forwards';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    function setStatus(html) { $('spotifyStatusText').innerHTML = html; }

    async function api(path, options = {}) {
      const res = await fetch(`/api/venue/${slug}${path}`, options);
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) {
        show('authGate');
        throw new Error('Session expired. Enter the admin password again.');
      }
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    async function getSpotifyToken() {
      return (await api('/spotify-token')).token;
    }

    $('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Checking...';
      try {
        const res = await fetch(`/api/venue/${slug}/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: $('passwordInput').value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Invalid password');
        show('startGate');
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Unlock Player';
      }
    });

    $('logoutBtn').addEventListener('click', async () => {
      await fetch(`/api/venue/${slug}/admin/logout`, { method: 'POST' }).catch(() => {});
      show('authGate');
    });

    $('startBtn').addEventListener('click', () => {
      if (!sdkReady) {
        showToast('Spotify player is still loading, try again in a second', 'error');
        return;
      }
      startPlayer();
    });

    $('playBtn').addEventListener('click', async () => {
      if (!spotifyPlayer) return;
      const state = await spotifyPlayer.getCurrentState();
      if (!state && !currentSongKey) {
        advance();
        return;
      }
      spotifyPlayer.togglePlay();
    });

    $('skipBtn').addEventListener('click', () => advance(true));

    window.onSpotifyWebPlaybackSDKReady = () => { sdkReady = true; };

    function startPlayer() {
      show('playerSection');
      setStatus('Connecting to Spotify...');

      spotifyPlayer = new Spotify.Player({
        name: `QueuePlay (${slug})`,
        getOAuthToken: cb => {
          getSpotifyToken().then(cb).catch(err => {
            showToast(err.message, 'error');
            setStatus('🔴 Spotify is not connected. Connect it from the admin dashboard.');
          });
        },
        volume: 0.8
      });
      // Unlocks audio on iOS/Safari; must run inside the click handler.
      if (spotifyPlayer.activateElement) spotifyPlayer.activateElement();

      spotifyPlayer.addListener('initialization_error', ({ message }) => showToast(message, 'error'));
      spotifyPlayer.addListener('authentication_error', () => {
        showToast('Spotify authorization failed. Reconnect Spotify in the admin dashboard.', 'error');
        setStatus('🔴 Spotify authorization failed.');
      });
      spotifyPlayer.addListener('account_error', () => {
        showToast('A Spotify Premium account is required for playback.', 'error');
        setStatus('🔴 Spotify Premium required.');
      });
      spotifyPlayer.addListener('playback_error', ({ message }) => showToast(message, 'error'));

      spotifyPlayer.addListener('player_state_changed', handleStateChange);

      spotifyPlayer.addListener('ready', ({ device_id }) => {
        deviceId = device_id;
        setStatus(`🟢 Live on <strong>QueuePlay (${slug})</strong>. Keep this tab open.`);
        if (pendingSong !== undefined) {
          const song = pendingSong;
          pendingSong = undefined;
          syncPlayback(song);
        }
      });

      spotifyPlayer.addListener('not_ready', () => {
        deviceId = null;
        setStatus('🔴 Player went offline. Reconnecting...');
      });

      spotifyPlayer.connect();
      connectWebSocket();
    }

    function handleStateChange(state) {
      if (!state) return;
      isPlaying = !state.paused;
      $('playBtn').textContent = isPlaying ? '⏸️' : '▶️';

      trackProgressMs = state.position;
      trackDurationMs = state.duration;
      updateProgressUI();

      if (isPlaying) startProgressTicker();
      else clearInterval(progressInterval);

      // A track finished: it is paused at 0 and our track moved into previous_tracks.
      const finished = state.paused && state.position === 0 && currentTrackId &&
        state.track_window.previous_tracks.some(t => t.id === currentTrackId);
      if (finished) advance();
    }

    function startProgressTicker() {
      clearInterval(progressInterval);
      progressInterval = setInterval(() => {
        if (!isPlaying) return;
        trackProgressMs = Math.min(trackProgressMs + 1000, trackDurationMs);
        updateProgressUI();
      }, 1000);
    }

    function updateProgressUI() {
      const pct = trackDurationMs ? (trackProgressMs / trackDurationMs) * 100 : 0;
      $('progressFill').style.width = `${Math.min(pct, 100)}%`;
      $('timeCurrent').textContent = formatTime(trackProgressMs / 1000);
      $('timeTotal').textContent = formatTime(trackDurationMs / 1000);
    }

    function formatTime(seconds) {
      if (!isFinite(seconds) || isNaN(seconds)) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function connectWebSocket() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}?venue=${encodeURIComponent(slug)}`);

      ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.type === 'init') {
          syncPlayback(message.nowPlaying);
          // Nothing playing but songs waiting: kick things off.
          if (!message.nowPlaying && message.queue && message.queue.length > 0) advance();
        } else if (message.type === 'now_playing') {
          syncPlayback(message.data);
        } else if (message.type === 'queue_updated') {
          if (!currentSongKey && message.data.queue.length > 0 && deviceId) advance();
        }
      };

      ws.onclose = () => setTimeout(connectWebSocket, 3000);
    }

    async function advance(manual = false) {
      if (advancing) return;
      advancing = true;
      try {
        await api('/play-next', { method: 'POST' });
        if (manual) showToast('Skipped');
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        setTimeout(() => { advancing = false; }, 1500);
      }
    }

    async function syncPlayback(song) {
      if (!deviceId) {
        pendingSong = song;
        renderSong(song);
        return;
      }

      renderSong(song);

      if (!song) {
        currentSongKey = null;
        currentTrackId = null;
        if (spotifyPlayer && isPlaying) spotifyPlayer.pause();
        return;
      }

      const key = `${song.song_id}|${song.started_at}`;
      if (key === currentSongKey) return; // already playing this (e.g. WS reconnect)
      currentSongKey = key;
      currentTrackId = song.song_id;

      try {
        const token = await getSpotifyToken();
        const uri = song.spotify_uri || `spotify:track:${song.song_id}`;
        const res = await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ uris: [uri] })
        });
        if (!res.ok && res.status !== 204) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.error?.message || `Spotify refused playback (${res.status})`);
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function renderSong(song) {
      if (!song) {
        $('nowPlayingTitle').textContent = 'Nothing Playing';
        $('nowPlayingArtist').textContent = 'Waiting for guests to add songs';
        $('nowPlayingArt').src = '/assets/music-placeholder.svg';
        trackProgressMs = 0;
        trackDurationMs = 0;
        updateProgressUI();
        return;
      }
      $('nowPlayingTitle').textContent = song.title;
      $('nowPlayingArtist').textContent = song.artist;
      $('nowPlayingArt').src = song.album_art || '/assets/music-placeholder.svg';
      document.title = `${song.title} · QueuePlay`;
    }

    fetch(`/api/venue/${slug}/admin/session`)
      .then(r => r.json())
      .then(d => show(d.authenticated ? 'startGate' : 'authGate'))
      .catch(() => show('authGate'));
  </script>
</body>
</html>
