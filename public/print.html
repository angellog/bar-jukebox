<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Print QR · QueuePlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root { --brand: #8b5cf6; --brand2: #ec4899; --ink: #111114; --muted: #5b5b66; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', system-ui, sans-serif; background: #e9e9ee; color: var(--ink); }

    .toolbar { position: sticky; top: 0; z-index: 5; display: flex; gap: .6rem; align-items: center; justify-content: center; flex-wrap: wrap; padding: .8rem 1rem; background: #17121f; color: #fff; font-size: .9rem; }
    .toolbar button, .toolbar a { font: inherit; padding: .5rem 1rem; border-radius: 999px; border: 1px solid #3a3346; background: #241d30; color: #fff; cursor: pointer; text-decoration: none; }
    .toolbar button.primary { background: linear-gradient(135deg, #8b5cf6, #ec4899); border: none; font-weight: 600; }
    .toolbar .hint { color: #b9b4c4; font-size: .8rem; }

    .sheet { width: 210mm; height: 297mm; margin: 1.5rem auto; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.18); position: relative; overflow: hidden; }

    /* 4 cards per A4 (each A6: 105 x 148.5 mm) */
    .cards { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; width: 100%; height: 100%; }
    .card { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 9mm 8mm 7mm; text-align: center; border: .3mm dashed #c9c9d2; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3mm; background: linear-gradient(90deg, var(--brand), var(--brand2)); }
    .brand { display: flex; align-items: center; gap: 2.5mm; justify-content: center; min-height: 11mm; }
    .brand img.logo { height: 11mm; width: 11mm; object-fit: cover; border-radius: 50%; }
    .venue { font-weight: 800; font-size: 5.2mm; line-height: 1.1; }
    .headline { font-weight: 800; font-size: 7mm; line-height: 1.05; margin-top: 2mm; }
    .headline span { color: var(--brand); }
    .qr { width: 52mm; height: 52mm; margin: 2mm 0; }
    .steps { display: flex; gap: 3mm; justify-content: center; font-size: 3.1mm; color: var(--muted); }
    .steps b { display: inline-flex; width: 4.6mm; height: 4.6mm; border-radius: 50%; align-items: center; justify-content: center; background: var(--brand); color: #fff; font-size: 2.6mm; margin-right: 1mm; }
    .url { font-size: 2.6mm; color: var(--muted); word-break: break-all; margin-top: 1.5mm; }
    .powered { font-size: 2.4mm; color: #9a9aa6; margin-top: 1mm; }

    /* Poster: one per A4 */
    .poster { display: none; height: 100%; flex-direction: column; align-items: center; justify-content: space-between; padding: 20mm 18mm 16mm; text-align: center; }
    .poster::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 8mm; background: linear-gradient(90deg, var(--brand), var(--brand2)); }
    .poster .brand { min-height: 22mm; gap: 5mm; }
    .poster .brand img.logo { height: 22mm; width: 22mm; }
    .poster .venue { font-size: 11mm; }
    .poster .headline { font-size: 17mm; margin-top: 6mm; }
    .poster .sub { font-size: 5.5mm; color: var(--muted); margin-top: 4mm; }
    .poster .qr { width: 110mm; height: 110mm; margin: 6mm 0; }
    .poster .steps { font-size: 6mm; gap: 8mm; }
    .poster .steps b { width: 9mm; height: 9mm; font-size: 5mm; margin-right: 2mm; }
    .poster .url { font-size: 4.5mm; margin-top: 4mm; }
    .poster .powered { font-size: 3.8mm; }
    body.layout-poster .cards { display: none; }
    body.layout-poster .poster { display: flex; }

    .error { max-width: 520px; margin: 4rem auto; padding: 2rem; background: #fff; border-radius: 12px; text-align: center; }

    @page { size: A4; margin: 0; }
    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .sheet { margin: 0; box-shadow: none; }
      .card { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .card::before, .poster::before, .steps b { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
    @media screen and (max-width: 820px) {
      .sheet { transform: scale(calc((100vw - 24px) / 794)); transform-origin: top center; margin: 1rem auto calc(-297mm + (100vw - 24px) * 1.414 + 1rem); }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button class="primary" onclick="window.print()">🖨 Print</button>
    <button id="toggleLayout"></button>
    <span class="hint">A4 paper · set margins to "None" and scale to 100%</span>
  </div>

  <div class="sheet" id="sheet">
    <div class="cards" id="cards"></div>
    <div class="poster" id="poster"></div>
  </div>

  <script>
    const slug = location.pathname.split('/').filter(Boolean)[1];
    const params = new URLSearchParams(location.search);
    let layout = params.get('layout') === 'poster' ? 'poster' : 'cards';

    const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function applyLayout() {
      document.body.classList.toggle('layout-poster', layout === 'poster');
      document.getElementById('toggleLayout').textContent = layout === 'poster' ? 'Switch to 4 table cards' : 'Switch to poster';
      const url = new URL(location.href);
      if (layout === 'poster') url.searchParams.set('layout', 'poster'); else url.searchParams.delete('layout');
      history.replaceState(null, '', url);
    }
    document.getElementById('toggleLayout').onclick = () => { layout = layout === 'poster' ? 'cards' : 'poster'; applyLayout(); };

    function block(v, guestUrl, big) {
      const logo = v.logo_url ? `<img class="logo" src="${esc(v.logo_url)}" alt="" onerror="this.remove()">` : '';
      return `
        <div class="brand">${logo}<div class="venue">${esc(v.name)}</div></div>
        <div>
          <div class="headline">Pick the <span>next song</span> 🎶</div>
          ${big ? '<div class="sub">Scan with your phone camera. No app needed.</div>' : ''}
        </div>
        <img class="qr" src="/api/venue/${encodeURIComponent(v.slug)}/qr.svg" alt="QR code to ${esc(guestUrl)}">
        <div>
          <div class="steps"><span><b>1</b>Scan</span><span><b>2</b>Search</span><span><b>3</b>Add</span></div>
          <div class="url">${esc(guestUrl.replace(/^https?:\/\//, ''))}</div>
          <div class="powered">Powered by QueuePlay</div>
        </div>`;
    }

    fetch(`/api/venue/${encodeURIComponent(slug)}`)
      .then(r => { if (!r.ok) throw new Error(); return r.json(); })
      .then(v => {
        document.title = `Print QR · ${v.name}`;
        if (/^#[0-9a-f]{6}$/i.test(v.brand_primary || '')) document.documentElement.style.setProperty('--brand', v.brand_primary);
        if (/^#[0-9a-f]{6}$/i.test(v.brand_secondary || '')) document.documentElement.style.setProperty('--brand2', v.brand_secondary);
        const guestUrl = `${location.origin}/v/${v.slug}`;
        document.getElementById('cards').innerHTML = Array.from({ length: 4 }, () => `<div class="card">${block(v, guestUrl, false)}</div>`).join('');
        document.getElementById('poster').innerHTML = block(v, guestUrl, true);
        applyLayout();
      })
      .catch(() => {
        document.getElementById('sheet').outerHTML = '<div class="error">Venue not found.</div>';
      });
  </script>
</body>
</html>
